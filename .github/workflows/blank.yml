name: Ejecución A Demanda - Ofertador Comercial P0

# Configuración para ejecutar ÚNICAMENTE a demanda desde GitHub UI
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de ejecución'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - stage

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clonar el código del repositorio privado
      - name: Checkout del código
        uses: actions/checkout@v4

      # Step 2: Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Instalar Newman y el reportero de reportes HTML
      - name: Instalar Newman y Newman-Reporter-HTMLExtra
        run: |
          npm install -g newman newman-reporter-htmlextra

      # Step 4: Crear carpeta para guardar el reporte
      - name: Crear carpeta de reportes
        run: mkdir -p reports

      # Step 5: Ejecutar la Colección de Postman con Newman
      - name: Ejecutar Colección Postman con Newman
        run: |
          newman run collections/onboarding/ONB_P0_Rechazos_MA_PS.postman_collection.json \
            --env-var "Username=${{ secrets.POSTMAN_USERNAME }}" \
            --env-var "Password=${{ secrets.POSTMAN_PASSWORD }}" \
            -r cli,htmlextra \
            --reporter-htmlextra-export reports/onb-rechazos-report.html

      # Step 6: Subir el Reporte HTML como un Artifact descargable
      - name: Guardar Reporte HTML
        if: always() # Guarda el reporte aunque algún test falle
        uses: actions/upload-artifact@v4
        with:
          name: Reporte-Newman-P0-${{ github.run_id }}
          path: reports/onb-rechazos-report.html
